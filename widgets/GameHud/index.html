<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tr('GAME HUD')</title>
  <link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
  <meta name="x-icue-widget-group" content="tr('DATACORE')" />

  <meta name="x-icue-property" content="fpsSensor" data-label="tr('FPS')" data-type="sensors-combobox" data-default="plugins.Sensorsdataprovider.getDefaultSensorIdBlock('fps')" />
  <meta name="x-icue-property" content="gpuLoadSensor" data-label="tr('GPU Load')" data-type="sensors-combobox" data-default="plugins.Sensorsdataprovider.getDefaultSensorIdBlock('load')" />
  <meta name="x-icue-property" content="gpuTempSensor" data-label="tr('GPU Temperature')" data-type="sensors-combobox" data-default="plugins.Sensorsdataprovider.getDefaultSensorIdBlock('temperature')" />
  <meta name="x-icue-property" content="cpuTempSensor" data-label="tr('CPU Temperature')" data-type="sensors-combobox" data-default="plugins.Sensorsdataprovider.getDefaultSensorIdBlock('temperature')" />
  <meta name="x-icue-property" content="fpsTarget" data-label="tr('FPS Target')" data-type="slider" data-default="120" data-min="30" data-max="360" data-step="10" />
  <meta name="x-icue-property" content="warmAt" data-label="tr('Warm At')" data-type="slider" data-default="70" data-min="40" data-max="100" data-step="1" data-unit-label="'°C'" />
  <meta name="x-icue-property" content="hotAt" data-label="tr('Hot At')" data-type="slider" data-default="85" data-min="50" data-max="110" data-step="1" data-unit-label="'°C'" />

  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#f4f5f7'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#e8202a'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07080a'" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="0" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script id="x-icue-groups" type="application/json">
  [
    {
      "title": "tr('GAME HUD')",
      "properties": ["fpsSensor", "gpuLoadSensor", "gpuTempSensor", "cpuTempSensor", "fpsTarget", "warmAt", "hotAt"],
      "info": "tr('Sensors left on their defaults are matched automatically by kind.')"
    },
    {
      "title": "tr('Widget Personalization')",
      "properties": ["textColor", "accentColor", "backgroundColor", "transparency"]
    }
  ]
  </script>

  <link rel="stylesheet" href="shared/styles/base.css" />
  <link rel="stylesheet" href="shared/styles/motorsport.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <main id="frame" class="frame carbon" data-fps="idle">
    <div class="rev" id="rev" aria-hidden="true"></div>
    <div class="dash">
      <section class="ms-panel fpsbox">
        <div class="fpsbox__head"><span class="ms-label fpsbox__title">FPS</span><span class="ms-label" id="fpsName"></span></div>
        <div class="fpsbox__main">
          <span class="ms-num fps__num" id="fpsNum">--</span>
          <div class="fps__stats">
            <div class="st"><span class="ms-label">AVG</span><b class="ms-num" id="fpsAvg">--</b></div>
            <div class="st st--best"><span class="ms-label">BEST</span><b class="ms-num" id="fpsBest">--</b></div>
            <div class="st"><span class="ms-label">LOW</span><b class="ms-num" id="fpsLow">--</b></div>
            <div class="st"><span class="ms-label">TARGET</span><b class="ms-num" id="fpsTargetOut">120</b></div>
          </div>
        </div>
        <svg class="trace" id="trace" viewBox="0 0 600 100" preserveAspectRatio="none">
          <line class="trace__target" id="traceTarget" x1="0" x2="600" y1="20" y2="20"></line>
          <path class="line__fill"></path><path class="line__stroke"></path>
        </svg>
      </section>
      <section class="ms-panel tile" id="gpuLoad" data-kind="load">
        <div class="ms-label">GPU LOAD</div>
        <div class="tile__read"><span class="ms-num tile__num">--</span><span class="ms-num tile__unit">%</span></div>
        <div class="tbar"><i></i></div>
        <svg class="spark" viewBox="0 0 600 100" preserveAspectRatio="none"><path class="line__fill"></path><path class="line__stroke"></path></svg>
        <div class="tile__name ms-label"></div>
      </section>
      <section class="ms-panel tile" id="gpuTemp" data-kind="temp">
        <div class="ms-label">GPU TEMP</div>
        <div class="tile__read"><span class="ms-num tile__num">--</span><span class="ms-num tile__unit">°</span><span class="tile__alt" hidden><span class="ms-label tile__alt-name"></span><span class="ms-num tile__alt-num">--</span></span></div>
        <div class="tbar"><i></i></div>
        <svg class="spark" viewBox="0 0 600 100" preserveAspectRatio="none"><path class="line__fill"></path><path class="line__stroke"></path></svg>
        <div class="tile__name ms-label"></div>
      </section>
      <section class="ms-panel tile" id="cpuTemp" data-kind="temp">
        <div class="ms-label">CPU TEMP</div>
        <div class="tile__read"><span class="ms-num tile__num">--</span><span class="ms-num tile__unit">°</span><span class="tile__alt" hidden><span class="ms-label tile__alt-name"></span><span class="ms-num tile__alt-num">--</span></span></div>
        <div class="tbar"><i></i></div>
        <svg class="spark" viewBox="0 0 600 100" preserveAspectRatio="none"><path class="line__fill"></path><path class="line__stroke"></path></svg>
        <div class="tile__name ms-label"></div>
      </section>
    </div>
  </main>

  <script src="shared/scripts/icue-adapter.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    icueEvents = {
      onICUEInitialized: onIcueDataUpdated,
      onDataUpdated: onIcueDataUpdated
    };

    onIcueDataUpdated();
  </script>
</body>
</html>
